<div>
  <!--*  BEST-Solution 1: Fire Observable via ASYNC, instead of subscribe into constructor -->
  <!-- Debug with JSON <pre>{{ (country$ | async) | json }}</pre> -->
  <select [formControl]="continentSelectCtrl">
    <option *ngFor="let option of (country$ | async)">
      {{option.continent}}
    </option>
  </select>
  <select [formControl]="countrySelectCtrl">
    <option *ngFor="let option of (country$ | async)">
      {{option.country}}
    </option>
  </select>

  <p>
    <!--* Solution 1: Use tap() to register data in controller -->
    You selected: {{continentSelection$ | async}} - {{countrySelection$ | async}}
    <!--* Solution 2: Use subscribe( in controller {{currentCountry}} -->
  </p>
